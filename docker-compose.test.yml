version: '3.8'

services:
  # 1. HashiCorp Vault in dev mode pre-populated with test KV secrets
  vault-test:
    image: hashicorp/vault:latest
    container_name: mcp-vault-test
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-test-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Mock HTTP/SSE MCP Backend Server
  mock-mcp-server:
    image: node:20-alpine
    container_name: mock-mcp-server
    command: >
      node -e '
        const http = require("http");
        const server = http.createServer((req, res) => {
          if (req.url === "/mcp" || req.url === "/") {
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end(JSON.stringify({
              jsonrpc: "2.0",
              result: {
                tools: [
                  { name: "echo", description: "Echoes input back", inputSchema: { type: "object" } },
                  { name: "health", description: "Returns service status", inputSchema: { type: "object" } }
                ]
              },
              id: 1
            }));
          } else {
            res.writeHead(200);
            res.end("OK");
          }
        });
        server.listen(8090, () => console.log("Mock MCP server running on 8090"));
      '
    ports:
      - "8090:8090"

  # 3. Router Gateway test container instance
  mcp-router-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-router-e2e
    ports:
      - "8088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_ENCRYPTION_KEY=SecurePassphraseForMcpDb2026!
      - VAULT_ADDR=http://vault-test:8200
      - VAULT_TOKEN=root-test-token
    depends_on:
      vault-test:
        condition: service_healthy
      mock-mcp-server:
        condition: service_started
