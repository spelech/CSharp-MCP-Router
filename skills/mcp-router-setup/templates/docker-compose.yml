services:
  mcp-router:
    image: ghcr.io/spelech/mcp-router:latest
    container_name: mcp-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      # Admin Key: compact ~32-char token (e.g. mcp-adm-...)
      - ROUTER_ADMIN_KEY=${ROUTER_ADMIN_KEY:-mcp-adm-Xk9L2mPq-7vN3wZ8aB1cE4fG9}
      # Master Key: optional, auto-generated to ./data/.master.key if omitted
      - ROUTER_MASTER_KEY=${ROUTER_MASTER_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - Admin__StandaloneAllowedNetworks__0=${STANDALONE_ALLOWED_NETWORK:-127.0.0.1}
      - Admin__StandaloneAllowedNetworks__1=::1
      # Uncomment to allow access from local LAN subnets:
      # - Admin__StandaloneAllowedNetworks__2=192.168.1.0/24
      # - Admin__StandaloneAllowedNetworks__3=10.0.0.0/8
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
