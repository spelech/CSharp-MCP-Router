version: '3.8'

services:
  # 1. HashiCorp Vault in dev mode pre-populated with test KV secrets and AppRole
  vault-test:
    image: hashicorp/vault:latest
    container_name: mcp-vault-test
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-test-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault-init:
    image: hashicorp/vault:latest
    container_name: mcp-vault-init
    depends_on:
      vault-test:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault-test:8200"
      VAULT_TOKEN: "root-test-token"
    command: >
      sh -c '
        echo "Populating vault KV secrets..." &&
        vault kv put secret/services/vault-test token=test-vault-token-123 &&
        echo "Enabling AppRole auth..." &&
        vault auth enable approle || true &&
        vault policy write test-policy - <<EOF
        path "secret/*" {
          capabilities = ["read", "list"]
        }
        EOF
        vault write auth/approle/role/test-role \
          secret_id_ttl=10m \
          token_num_uses=10 \
          token_ttl=20m \
          token_max_ttl=30m \
          secret_id_num_uses=40 \
          policies="test-policy" || true &&
        vault write auth/approle/role/test-role/role-id role_id=test-role-id || true &&
        vault write auth/approle/role/test-role/custom-secret-id secret_id=test-secret-id || true &&
        echo "Vault populated."
      '

  # 2. OpenLDAP Test Container (LDAPS Port 636 + Port 389)
  ldap-test:
    image: osixia/openldap:latest
    container_name: mcp-ldap-test
    environment:
      LDAP_ORGANISATION: "Corp Local"
      LDAP_DOMAIN: "corp.local"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_TLS: "true"
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      - ./tests/fixtures/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports:
      - "3389:389"
      - "6636:636"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=corp,dc=local", "-s", "base"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. MySQL 8.0 Test Database
  mysql-test:
    image: mysql:8.0
    container_name: mcp-mysql-test
    environment:
      MYSQL_DATABASE: "mcp_router_test"
      MYSQL_USER: "mcp_user"
      MYSQL_PASSWORD: "mcp_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    volumes:
      - ./tests/fixtures/sql/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Microsoft SQL Server 2022 (Optional profile for full multi-db parity)
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mcp-mssql-test
    profiles: ["mssql", "full"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "McpRouterMSSQL2026!"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P McpRouterMSSQL2026! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Mock HTTP/SSE MCP Backend Server
  mock-mcp-server:
    image: node:20-alpine
    container_name: mock-mcp-server
    command: >
      node -e '
        const http = require("http");
        let sseConnections = [];
        const server = http.createServer((req, res) => {
          console.log("[MOCK] Incoming " + req.method + " request to " + req.url);
          if (req.url === "/sse") {
            res.writeHead(200, {
              "Content-Type": "text/event-stream",
              "Cache-Control": "no-cache",
              "Connection": "keep-alive"
            });
            sseConnections.push(res);
            res.write("event: endpoint\n");
            res.write("data: http://mock-mcp-server:8090/message\n\n");
            const interval = setInterval(() => {
                res.write(": keepalive\n\n");
            }, 10000);
            res.on("close", () => {
                clearInterval(interval);
                sseConnections = sseConnections.filter(c => c !== res);
            });
            return;
          }
          if (req.method === "POST" || req.url === "/mcp" || req.url === "/") {
            let body = "";
            req.on("data", chunk => body += chunk.toString());
            req.on("end", () => {
              let parsedId = 1;
              let method = "";
              try { 
                if (body) {
                  const j = JSON.parse(body);
                  parsedId = j.id || 1; 
                  method = j.method;
                }
              } catch(e) {}
              
              console.log("[MOCK] Parsed method: " + method);
              
              const isSsePost = req.url === "/message";
              const sendResponse = (payload) => {
                  if (isSsePost) {
                      console.log("[MOCK] Sending SSE message payload for " + method + " to " + sseConnections.length + " clients");
                      sseConnections.forEach(c => c.write("event: message\ndata: " + JSON.stringify(payload) + "\n\n"));
                      res.writeHead(202);
                      res.end();
                  } else {
                      console.log("[MOCK] Sending direct HTTP payload for " + method);
                      res.writeHead(200, { "Content-Type": "application/json" });
                      res.end(JSON.stringify(payload));
                  }
              };

              if (method === "initialize") {
                sendResponse({
                  jsonrpc: "2.0",
                  id: parsedId,
                  result: { protocolVersion: "2024-11-05", capabilities: {}, serverInfo: { name: "mock", version: "1" } }
                });
              } else {
                sendResponse({
                  jsonrpc: "2.0",
                  result: {
                    tools: [
                      { name: "semantic_search", description: "Search docs", inputSchema: { type: "object" } },
                      { name: "health", description: "Returns service status", inputSchema: { type: "object" } }
                    ]
                  },
                  id: parsedId
                });
              }
            });
            return;
          }
          res.writeHead(200);
          res.end("OK");
        });
        server.listen(8090, () => console.log("Mock MCP server running on 8090"));
      '
    ports:
      - "8090:8090"

  # 6. Router Gateway test container instance
  mcp-router-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-router-e2e
    ports:
      - "8088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_ENCRYPTION_KEY=SecurePassphraseForMcpDb2026!
      - VAULT_ADDR=http://vault-test:8200
      - VAULT_TOKEN=root-test-token
      - Ldap__Server=ldap-test
      - Ldap__Port=636
      - Ldap__UseSsl=true
      - Ldap__Domain=corp.local
      - Ldap__BaseDn=dc=corp,dc=local
      - Ldap__BindDn=cn=admin,dc=corp,dc=local
      - Ldap__BindPassword=adminpassword
      - Oidc__RequireTrustedProxy=false
    depends_on:
      vault-test:
        condition: service_healthy
      ldap-test:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
      mock-mcp-server:
        condition: service_started
